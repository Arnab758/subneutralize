[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subneutralize"
version = "0.1.3"
description = "Latent Dynamical Consensus Governor for Autoregressive Reasoning Models"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [
    { name = "Arnab Dutta" }
]
keywords = [
    "deepseek-r1",
    "reasoning-models",
    "inference-optimization",
    "vllm",
    "test-time-compute",
    "mechanistic-interpretability",
    "overthinking"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
]

[project.optional-dependencies]
serve = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
]
test = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
]

[project.scripts]
subneutralize = "subneutralize.cli:main"

[project.urls]
"Homepage" = "https://github.com/Arnab758/subneutralize"
"Bug Tracker" = "https://github.com/Arnab758/subneutralize/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["subneutralize*"]
